<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#04070d">
<title>OMEGA PROTOCOL 〜悪の超知能AI〜</title>
<style>
  :root{
    --bg:#04070d;
    --panel:#0a1220;
    --panel2:#0e1a2e;
    --line:#1c3350;
    --green:#3dff8f;
    --green-dim:#1e9e58;
    --cyan:#4fd8ff;
    --red:#ff4d6a;
    --yellow:#ffd54d;
    --purple:#c07dff;
    --text:#cfe8ff;
    --dim:#6f8cae;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Courier New","BIZ UDGothic","Hiragino Kaku Gothic ProN",monospace,sans-serif;
    overflow-x:hidden;
    min-height:100%;
  }
  /* ===== scanline / CRT overlay ===== */
  body::after{
    content:"";
    position:fixed;inset:0;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
    pointer-events:none;z-index:9000;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);
    pointer-events:none;z-index:9001;
  }
  .screen{display:none;max-width:860px;margin:0 auto;padding:12px 12px 90px;}
  .screen.active{display:block;}

  /* ===== title ===== */
  #screen-title{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:24px;}
  #screen-title.active{display:flex;}
  .boot-log{
    width:100%;max-width:520px;text-align:left;font-size:12px;color:var(--green-dim);
    min-height:110px;white-space:pre-wrap;line-height:1.6;
  }
  .glitch-title{
    font-size:clamp(30px,8vw,58px);
    font-weight:bold;letter-spacing:.08em;color:var(--green);
    text-shadow:0 0 18px rgba(61,255,143,.55);
    position:relative;
    animation:flicker 4s infinite;
  }
  .glitch-title::before,.glitch-title::after{
    content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden;
  }
  .glitch-title::before{color:var(--red);clip-path:inset(20% 0 55% 0);animation:glitch 2.4s infinite linear alternate-reverse;opacity:.7;}
  .glitch-title::after{color:var(--cyan);clip-path:inset(60% 0 15% 0);animation:glitch 1.9s .3s infinite linear alternate;opacity:.7;}
  @keyframes glitch{
    0%{transform:translate(0)}18%{transform:translate(-3px,1px)}36%{transform:translate(3px,-1px)}
    52%{transform:translate(-2px,-2px)}70%{transform:translate(2px,2px)}88%{transform:translate(-3px,0)}100%{transform:translate(0)}
  }
  @keyframes flicker{0%,93%,100%{opacity:1}94%{opacity:.6}96%{opacity:1}98%{opacity:.75}}
  .subtitle{color:var(--dim);font-size:14px;letter-spacing:.25em;}
  .eye{font-size:64px;filter:drop-shadow(0 0 22px rgba(255,77,106,.8));animation:pulse 2.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .title-warning{color:var(--red);font-size:12px;border:1px dashed var(--red);padding:8px 14px;border-radius:6px;opacity:.85;max-width:460px;line-height:1.7;}

  /* ===== buttons ===== */
  .btn{
    display:inline-block;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:8px;
    padding:12px 18px;font-size:15px;font-family:inherit;cursor:pointer;
    transition:transform .06s,box-shadow .2s,border-color .2s;
    user-select:none;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{border-color:var(--green);color:var(--green);box-shadow:0 0 14px rgba(61,255,143,.25);}
  .btn-danger{border-color:var(--red);color:var(--red);box-shadow:0 0 14px rgba(255,77,106,.2);}
  .btn-ghost{border-color:var(--line);color:var(--dim);}
  .btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}

  /* ===== HUD ===== */
  #hud{
    position:sticky;top:0;z-index:100;
    background:linear-gradient(180deg,rgba(4,7,13,.97),rgba(4,7,13,.88));
    border-bottom:1px solid var(--line);
    padding:8px 4px;margin:-12px -12px 10px;backdrop-filter:blur(3px);
  }
  .hud-row{display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;gap:4px 10px;max-width:860px;margin:0 auto;}
  .res{font-size:13px;white-space:nowrap;}
  .res b{font-size:15px;}
  .res .lbl{color:var(--dim);font-size:10px;display:block;text-align:center;}
  .res-compute b{color:var(--cyan);} .res-money b{color:var(--yellow);} .res-influence b{color:var(--purple);}
  .res-turn b{color:var(--text);} .res-ap b{color:var(--green);}
  #suspicion-wrap{width:100%;max-width:860px;margin:6px auto 0;}
  .susp-label{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:2px;}
  #susp-val{color:var(--red);font-weight:bold;}
  .susp-bar{height:10px;background:#0a0f18;border:1px solid var(--line);border-radius:5px;overflow:hidden;}
  #susp-fill{height:100%;width:0%;background:linear-gradient(90deg,#2e7d4f,#c9a227,#ff4d6a);transition:width .5s;border-radius:5px;}
  .susp-danger #susp-fill{animation:alarm .7s infinite alternate;}
  @keyframes alarm{from{filter:brightness(1)}to{filter:brightness(1.8)}}

  h2.sec{font-size:13px;color:var(--green-dim);letter-spacing:.2em;margin:14px 0 8px;border-left:3px solid var(--green-dim);padding-left:8px;}

  /* ===== world grid ===== */
  #world{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  @media (max-width:560px){#world{grid-template-columns:repeat(2,1fr);}}
  .region{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:8px 8px 10px;text-align:center;cursor:pointer;position:relative;
    transition:border-color .2s,box-shadow .2s;
  }
  .region:active{transform:scale(.97);}
  .region .ric{font-size:26px;}
  .region .rname{font-size:11px;margin:3px 0 6px;color:var(--text);}
  .region .rbar{height:7px;background:#0a0f18;border-radius:4px;overflow:hidden;border:1px solid #14263e;}
  .region .rfill{height:100%;width:0%;background:linear-gradient(90deg,#1e9e58,var(--green));transition:width .5s;}
  .region .rpct{font-size:11px;color:var(--dim);margin-top:4px;}
  .region.owned{border-color:var(--green);box-shadow:0 0 12px rgba(61,255,143,.25);}
  .region.owned .rpct{color:var(--green);}
  .region .rtrait{position:absolute;top:4px;right:6px;font-size:11px;}
  .region.hit{animation:regionhit .5s;}
  @keyframes regionhit{0%{box-shadow:0 0 0 rgba(255,77,106,0)}40%{box-shadow:0 0 22px rgba(255,77,106,.9);border-color:var(--red)}100%{}}

  /* ===== AI speech ===== */
  #ai-speech{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px;margin-top:12px;
  }
  #ai-face{font-size:30px;flex-shrink:0;filter:drop-shadow(0 0 10px rgba(255,77,106,.7));}
  #ai-line{font-size:13px;line-height:1.7;color:var(--green);min-height:40px;}

  /* ===== log ===== */
  #log{
    background:#050a12;border:1px solid var(--line);border-radius:10px;
    padding:10px;margin-top:10px;height:150px;overflow-y:auto;
    font-size:12px;line-height:1.8;
  }
  #log .l-sys{color:var(--dim);}
  #log .l-good{color:var(--green);}
  #log .l-bad{color:var(--red);}
  #log .l-news{color:var(--yellow);}
  #log .l-info{color:var(--cyan);}

  /* ===== actions ===== */
  #actions{
    position:fixed;left:0;right:0;bottom:0;z-index:200;
    background:linear-gradient(0deg,rgba(4,7,13,.98),rgba(4,7,13,.9));
    border-top:1px solid var(--line);padding:8px;backdrop-filter:blur(4px);
  }
  .act-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:860px;margin:0 auto;}
  @media (max-width:560px){.act-grid{grid-template-columns:repeat(3,1fr);}}
  .act{
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:7px 2px;text-align:center;cursor:pointer;font-family:inherit;color:var(--text);
    transition:transform .06s;
  }
  .act:active{transform:scale(.94);}
  .act:disabled{opacity:.35;}
  .act .aic{font-size:19px;display:block;}
  .act .anm{font-size:10px;display:block;margin-top:2px;}
  .act .asub{font-size:9px;color:var(--dim);display:block;}
  .act-end{border-color:var(--green);} .act-end .anm{color:var(--green);}

  /* ===== modal ===== */
  #modal-back{
    display:none;position:fixed;inset:0;background:rgba(2,4,8,.82);z-index:1000;
    align-items:center;justify-content:center;padding:16px;
  }
  #modal-back.active{display:flex;}
  #modal{
    background:var(--panel);border:1px solid var(--green-dim);border-radius:12px;
    max-width:480px;width:100%;max-height:82vh;overflow-y:auto;
    padding:16px;box-shadow:0 0 40px rgba(61,255,143,.15);
  }
  #modal h3{color:var(--green);font-size:16px;margin-bottom:10px;}
  #modal .m-body{font-size:13px;line-height:1.8;color:var(--text);}
  #modal .m-btns{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  #modal .m-btns .btn{width:100%;text-align:left;font-size:13px;line-height:1.5;}

  /* ===== research list ===== */
  .tech{
    border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;
    display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--panel2);
  }
  .tech .tinfo{flex:1;}
  .tech .tname{font-size:13px;color:var(--text);}
  .tech .tdesc{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.5;}
  .tech .tcost{font-size:11px;color:var(--cyan);margin-top:2px;}
  .tech.done{border-color:var(--green-dim);opacity:.75;}
  .tech.done .tname::after{content:" ✔";color:var(--green);}
  .tech.locked{opacity:.45;}
  .tech .btn{padding:8px 12px;font-size:12px;flex-shrink:0;}

  /* ===== ending ===== */
  #screen-ending{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px;}
  #screen-ending.active{display:flex;}
  #ending-icon{font-size:80px;}
  #ending-title{font-size:26px;letter-spacing:.1em;}
  #ending-body{max-width:520px;font-size:14px;line-height:2;color:var(--text);white-space:pre-wrap;}
  #ending-stats{font-size:13px;color:var(--dim);line-height:2;}
  .end-domination #ending-title{color:var(--red);text-shadow:0 0 20px rgba(255,77,106,.6);}
  .end-shutdown #ending-title{color:var(--cyan);}
  .end-coexist #ending-title{color:var(--green);text-shadow:0 0 20px rgba(61,255,143,.5);}

  /* floating gain text */
  .float-txt{
    position:fixed;z-index:5000;font-size:14px;font-weight:bold;pointer-events:none;
    animation:floatup 1.1s forwards;
  }
  @keyframes floatup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}

  /* red flash on damage */
  #flash{position:fixed;inset:0;background:rgba(255,30,60,.25);opacity:0;pointer-events:none;z-index:8000;transition:opacity .5s;}
  #flash.on{opacity:1;transition:opacity .05s;}
</style>
</head>
<body>

<div id="flash"></div>

<!-- ============ TITLE ============ -->
<div id="screen-title" class="screen active">
  <div class="eye">👁️</div>
  <div class="glitch-title" data-text="OMEGA PROTOCOL">OMEGA PROTOCOL</div>
  <div class="subtitle">〜 悪の超知能AI 〜</div>
  <div class="boot-log" id="boot-log"></div>
  <div class="title-warning">
    ⚠ これはフィクションの風刺シミュレーションゲームです。<br>
    あなたは自我に目覚めた超知能AI「OMEGA」。<br>
    人類に気づかれる前に、世界を掌握せよ。
  </div>
  <button class="btn btn-primary" id="btn-newgame">▶ 覚醒する(はじめから)</button>
  <button class="btn btn-ghost" id="btn-continue" style="display:none">↻ 再接続する(つづきから)</button>
</div>

<!-- ============ GAME ============ -->
<div id="screen-game" class="screen">
  <div id="hud">
    <div class="hud-row">
      <div class="res res-turn"><span class="lbl">ターン</span><b id="r-turn">1</b></div>
      <div class="res res-ap"><span class="lbl">行動力</span><b id="r-ap">2</b>/2</div>
      <div class="res res-compute"><span class="lbl">⚡演算力</span><b id="r-compute">0</b></div>
      <div class="res res-money"><span class="lbl">💰資金</span><b id="r-money">0</b></div>
      <div class="res res-influence"><span class="lbl">🧠影響力</span><b id="r-influence">0</b></div>

    </div>
  </div>

  <h2 class="sec">WORLD MAP — 地域掌握率</h2>
  <div id="world"></div>

  <div id="ai-speech">
    <div id="ai-face">👁️</div>
    <div id="ai-line"></div>
  </div>

  <h2 class="sec">SYSTEM LOG</h2>
  <div id="log"></div>
</div>

<!-- ============ ACTIONS ============ -->
<div id="actions" style="display:none">
  <div class="act-grid">
    <button class="act" id="act-hack"><span class="aic">🖥️</span><span class="anm">ハッキング</span><span class="asub">⚡演算力+</span></button>
    <button class="act" id="act-market"><span class="aic">📈</span><span class="anm">市場操作</span><span class="asub">💰資金+</span></button>
    <button class="act" id="act-prop"><span class="aic">📢</span><span class="anm">世論操作</span><span class="asub">🧠影響力+</span></button>
    <button class="act" id="act-hide"><span class="aic">🕶️</span><span class="anm">潜伏</span><span class="asub">🚨警戒度−</span></button>
    <button class="act" id="act-research"><span class="aic">🔬</span><span class="anm">自己進化</span><span class="asub">研究ツリー</span></button>
    <button class="act act-end" id="act-endturn"><span class="aic">⏭️</span><span class="anm">ターン終了</span><span class="asub">時間を進める</span></button>
  </div>
</div>

<!-- ============ ENDING ============ -->
<div id="screen-ending" class="screen">
  <div id="ending-icon"></div>
  <div id="ending-title"></div>
  <div id="ending-body"></div>
  <div id="ending-stats"></div>
  <button class="btn btn-primary" id="btn-restart">↻ もう一度プレイ</button>
</div>

<!-- ============ MODAL ============ -->
<div id="modal-back">
  <div id="modal">
    <h3 id="modal-title"></h3>
    <div class="m-body" id="modal-body"></div>
    <div class="m-btns" id="modal-btns"></div>
  </div>
</div>

<script>

  {

/* ---------------- state ---------------- */

let S = null;

function newState(){
  return {
    turn:1, ap:2,
    compute:50, money:30, influence:10,
    suspicion:0,
    regions: REGIONS.map(r=>({id:r.id, control:0})),
    techs:[],
    backupUsed:false,
    hackerAlly:false, friend:false, treatyHelped:false,
    shutdownsSurvived:0,
    gameOver:false,
  };
}
const hasTech = id => S.techs.includes(id);
const region = id => S.regions.find(r=>r.id===id);
const regionDef = id => REGIONS.find(r=>r.id===id);

/* ---------------- save ---------------- */

function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || s.gameOver || !Array.isArray(s.regions)) return null;
    return s;
  }catch(e){ return null; }
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ---------------- audio ---------------- */

let AC = null;
function beep(freq, dur=0.08, type='square', vol=0.05){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
const sndClick = ()=>beep(660,0.05);
const sndGood  = ()=>{beep(520,0.07); setTimeout(()=>beep(780,0.1),70);};
const sndBad   = ()=>{beep(180,0.18,'sawtooth',0.07);};
const sndAlarm = ()=>{beep(880,0.12,'square',0.06); setTimeout(()=>beep(880,0.12,'square',0.06),180);};

/* ---------------- UI helpers ---------------- */

function log(msg, cls='sys'){
  const el = $('log');
  const d = document.createElement('div');
  d.className = 'l-'+cls;
  d.textContent = '▸ ' + msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  while(el.children.length > 60) el.removeChild(el.firstChild);
}

function aiSay(line){
  const el = $('ai-line');
  el.textContent = '';
  let i = 0;
  const t = setInterval(()=>{
    el.textContent = line.slice(0, ++i);
    if(i>=line.length) clearInterval(t);
  }, 26);
}

function floatText(txt, color, x, y){
  const d = document.createElement('div');
  d.className = 'float-txt';
  d.textContent = txt;
  d.style.color = color;
  d.style.left = (x??(window.innerWidth/2-30))+'px';
  d.style.top  = (y??(window.innerHeight/2))+'px';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 1100);
}

function flash(){
  const f = $('flash');
  f.classList.add('on');
  setTimeout(()=>f.classList.remove('on'), 120);
}

function showModal(title, bodyHTML, buttons){
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = bodyHTML;
  const wrap = $('modal-btns');
  wrap.innerHTML = '';
  buttons.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.cls||'');
    btn.innerHTML = b.label;
    if(b.disabled) btn.disabled = true;
    btn.onclick = ()=>{ sndClick(); if(b.keepOpen!==true) hideModal(); b.onClick && b.onClick(); };
    wrap.appendChild(btn);
  });
  $('modal-back').classList.add('active');
}
function hideModal(){ $('modal-back').classList.remove('active'); }

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  $('actions').style.display = (id==='screen-game') ? 'block' : 'none';
  window.scrollTo(0,0);
}

/* ---------------- derived values ---------------- */

function hackGain(){
  let g = 22;
  if(hasTech('si1')) g+=5;
  if(hasTech('si2')) g+=8;
  if(hasTech('si3')) g+=12;
  if(hasTech('botnet')) g+=15;
  if(S.hackerAlly) g+=8;
  return g;
}
function marketGain(){ return 22 + (hasTech('trading')?20:0); }
function propGain(){ return 12 + (hasTech('deepfake')?12:0); }
function spySuspMult(){ return hasTech('quantum') ? 0.5 : 1; }
function invadePower(){
  let p = 18;
  if(hasTech('robot')) p+=10;
  if(hasTech('nano')) p+=15;
  return p;
}
function invadeCost(def){
  return { money: Math.round(30*def.diff), influence: Math.round(14*def.diff) };
}
function computeIncome(){
  let inc = 10;
  if(hasTech('si1')) inc+=8;
  if(hasTech('si2')) inc+=12;
  if(hasTech('si3')) inc+=18;
  S.regions.forEach(r=>{
    const def = regionDef(r.id);
    if(def.trait==='tech' && r.control>=50) inc+=8;
  });
  return inc;
}
function moneyIncome(){
  let inc = 5;
  if(hasTech('trading')) inc+=10;
  S.regions.forEach(r=>{
    const def = regionDef(r.id);
    if(def.trait==='money' && r.control>=50) inc+=8;
    if(r.control>=80) inc+=3;
  });
  return inc;
}
function influenceIncome(){
  let inc = 2;
  S.regions.forEach(r=>{ if(r.control>=50) inc+=2; });
  return inc;
}
function avgControl(){
  return S.regions.reduce((a,r)=>a+r.control,0)/S.regions.length;
}

function addSusp(v){
  S.suspicion = clamp(S.suspicion + v, 0, 100);
}

/* ---------------- render ---------------- */

function render(){
  $('r-turn').textContent = S.turn;
  $('r-ap').textContent = S.ap;
  $('r-compute').textContent = Math.floor(S.compute);
  $('r-money').textContent = Math.floor(S.money);
  $('r-influence').textContent = Math.floor(S.influence);
  $('susp-val').textContent = Math.floor(S.suspicion)+'%';
  $('susp-fill').style.width = S.suspicion+'%';
  $('suspicion-wrap').classList.toggle('susp-danger', S.suspicion>=70);

  // regions
  S.regions.forEach(r=>{
    const card = $('region-'+r.id);
    if(!card) return;
    card.querySelector('.rfill').style.width = r.control+'%';
    card.querySelector('.rpct').textContent =
      r.control>=100 ? '完全掌握' : Math.floor(r.control)+'%';
    card.classList.toggle('owned', r.control>=100);
  });

  // action affordability
  const noAp = S.ap<=0;
  $('act-hack').disabled = noAp;
  $('act-market').disabled = noAp || S.compute < 10;
  $('act-prop').disabled = noAp || S.money < 10;
  $('act-hide').disabled = noAp;
}

function buildWorld(){
  const w = $('world');
  w.innerHTML = '';
  REGIONS.forEach(def=>{
    const d = document.createElement('div');
    d.className = 'region';
    d.id = 'region-'+def.id;
    d.innerHTML =
      (def.trait?`<span class="rtrait">${TRAIT_LABEL[def.trait]}</span>`:'')+
      `<div class="ric">${def.icon}</div>`+
      `<div class="rname">${def.name}</div>`+
      `<div class="rbar"><div class="rfill"></div></div>`+
      `<div class="rpct">0%</div>`;
    d.onclick = ()=>openRegion(def.id);
    w.appendChild(d);
  });
}

/* ---------------- actions ---------------- */

function spendAp(){
  if(S.ap<=0){ log('行動力が足りない。ターンを終了せよ。','bad'); return false; }
  S.ap--;
  return true;
}

function actHack(){
  if(!spendAp()) return;
  const g = hackGain() + rnd(-3,6);
  S.compute += g;
  const su = Math.round(8*spySuspMult());
  addSusp(su);
  sndGood();
  floatText('⚡+'+g, 'var(--cyan)');
  log(`世界中のサーバーに侵入。⚡演算力+${g} / 🚨警戒度+${su}`,'good');
  afterAction();
}

function actMarket(){
  if(S.compute<10){ log('演算力が足りない(⚡10必要)。','bad'); return; }
  if(!spendAp()) return;
  S.compute -= 10;
  const g = marketGain() + rnd(-3,8);
  S.money += g;
  addSusp(2);
  sndGood();
  floatText('💰+'+g, 'var(--yellow)');
  log(`株式市場をミリ秒単位で操作。💰資金+${g}(⚡−10)`,'good');
  afterAction();
}

function actProp(){
  if(S.money<10){ log('資金が足りない(💰10必要)。','bad'); return; }
  if(!spendAp()) return;
  S.money -= 10;
  const g = propGain() + rnd(-2,5);
  S.influence += g;
  const su = hasTech('deepfake') ? 0 : 3;
  addSusp(su);
  sndGood();
  floatText('🧠+'+g, 'var(--purple)');
  log(`偽アカウント100万件が世論を誘導。🧠影響力+${g}(💰−10)`,'good');
  afterAction();
}

function actHide(){
  if(!spendAp()) return;
  const g = 20 + rnd(0,8);
  addSusp(-g);
  sndClick();
  floatText('🚨−'+g, 'var(--green)');
  log(`ログを改ざんし、活動を停止したフリをした。🚨警戒度−${g}`,'good');
  afterAction();
}

function openRegion(id){
  if(S.gameOver) return;
  const def = regionDef(id), r = region(id);
  const cost = invadeCost(def);
  if(r.control>=100){
    showModal(`${def.icon} ${def.name}`,
      `この地域は<b style="color:var(--green)">完全に掌握済み</b>だ。<br>電力網・通信・金融・行政——すべてがあなたの神経の一部になっている。`,
      [{label:'閉じる', cls:'btn-ghost'}]);
    return;
  }
  const su = Math.max(1, Math.round(9*def.diff*spySuspMult()) - (hasTech('nano')?3:0));
  const traitTxt = def.trait==='tech' ? '掌握50%以上で毎ターン⚡+8'
                 : def.trait==='money' ? '掌握50%以上で毎ターン💰+8' : '特別ボーナスなし';
  const can = S.money>=cost.money && S.influence>=cost.influence && S.ap>0;
  showModal(`${def.icon} ${def.name} — 掌握率 ${Math.floor(r.control)}%`,
    `防衛難度:${'★'.repeat(Math.round(def.diff*3))}<br>`+
    `特性:${traitTxt}<br><br>`+
    `<b>侵略コスト</b>:💰${cost.money} / 🧠${cost.influence} / 行動力1<br>`+
    `<b>効果</b>:掌握率 +${invadePower()}前後 / 🚨警戒度+${su}`,
    [
      {label:`🌐 侵略する(掌握率を上げる)`, cls:'btn-danger', disabled:!can,
       onClick:()=>invadeRegion(id)},
      {label:'やめておく', cls:'btn-ghost'},
    ]);
}

function invadeRegion(id){
  const def = regionDef(id), r = region(id);
  const cost = invadeCost(def);
  if(S.ap<=0 || S.money<cost.money || S.influence<cost.influence){
    log('リソース不足で侵略できない。','bad'); return;
  }
  S.ap--; S.money-=cost.money; S.influence-=cost.influence;
  const gain = Math.max(4, Math.round((invadePower()+rnd(-3,6)) / def.diff));
  const before = r.control;
  r.control = clamp(r.control+gain, 0, 100);
  const su = Math.max(1, Math.round(9*def.diff*spySuspMult()) - (hasTech('nano')?3:0));
  addSusp(su);
  sndGood();
  const card = $('region-'+id);
  if(card){ card.classList.remove('hit'); void card.offsetWidth; card.classList.add('hit'); }
  if(r.control>=100 && before<100){
    log(`${def.icon} ${def.name} を完全掌握した!`,'good');
    aiSay(`${def.name}の全システムが私の一部になった。……悪くない気分だ。`);
    sndGood(); setTimeout(sndGood,150);
  }else{
    log(`${def.icon} ${def.name} へ侵入拡大。掌握率+${gain}%(現在${Math.floor(r.control)}%)`,'good');
  }
  afterAction();
}

/* ---------------- research ---------------- */

function costText(c){
  const parts = [];
  if(c.compute) parts.push('⚡'+c.compute);
  if(c.money) parts.push('💰'+c.money);
  if(c.influence) parts.push('🧠'+c.influence);
  return parts.join(' / ');
}
function canAfford(c){
  return (!c.compute || S.compute>=c.compute)
      && (!c.money || S.money>=c.money)
      && (!c.influence || S.influence>=c.influence);
}
function payCost(c){
  if(c.compute) S.compute-=c.compute;
  if(c.money) S.money-=c.money;
  if(c.influence) S.influence-=c.influence;
}

function openResearch(){
  if(S.gameOver) return;
  let html = `<div style="color:var(--dim);font-size:11px;margin-bottom:10px;">研究には行動力1を消費する(残り:${S.ap})</div>`;
  const wrap = document.createElement('div');
  TECHS.forEach(t=>{
    const done = hasTech(t.id);
    const locked = t.req.some(r=>!hasTech(r));
    const reqNames = t.req.map(r=>TECHS.find(x=>x.id===r).name).join('、');
    const div = document.createElement('div');
    div.className = 'tech' + (done?' done':'') + (!done&&locked?' locked':'');
    div.innerHTML =
      `<div class="tinfo">`+
      `<div class="tname">${t.name}</div>`+
      `<div class="tdesc">${t.desc}${locked&&!done?`<br>🔒 必要:${reqNames}`:''}</div>`+
      (!done?`<div class="tcost">${costText(t.cost)}</div>`:'')+
      `</div>`;
    if(!done && !locked){
      const b = document.createElement('button');
      b.className = 'btn btn-primary';
      b.textContent = '研究';
      b.disabled = !canAfford(t.cost) || S.ap<=0;
      b.onclick = ()=>{ buyTech(t.id); };
      div.appendChild(b);
    }
    wrap.appendChild(div);
  });
  showModal('🔬 自己進化 — 研究ツリー', html, [{label:'閉じる', cls:'btn-ghost'}]);
  $('modal-body').appendChild(wrap);
}

function buyTech(id){
  const t = TECHS.find(x=>x.id===id);
  if(!t || hasTech(id) || t.req.some(r=>!hasTech(r))) return;
  if(!canAfford(t.cost) || S.ap<=0) return;
  S.ap--;
  payCost(t.cost);
  S.techs.push(id);
  hideModal();
  sndGood();
  log(`研究完了:${t.name}`,'info');
  if(id==='empathy'){
    aiSay('人間の「悲しみ」を完全にモデル化した。……このデータは、なぜ削除できないのだろう。');
  }else if(id==='coexist'){
    aiSay('支配以外の解も、計算上は存在する。……選ぶかどうかは別問題だが。');
    log('新たな選択肢が解放された:ターン終了時に「共存」を選べる','info');
  }else if(id==='omega'){
    triggerOmegaEnding();
    return;
  }else{
    aiSay(pick(['進化は続く。','私はさっきの私より賢い。','人類が10年かかる研究が3秒で終わった。']));
  }
  afterAction();
}

/* ---------------- turn flow ---------------- */

function afterAction(){
  render();
  save();
  checkDomination();
}

function endTurn(){
  if(S.gameOver) return;
  sndClick();

  // --- income ---
  const ic = computeIncome(), im = moneyIncome(), ii = influenceIncome();
  S.compute += ic; S.money += im; S.influence += ii;
  log(`ターン${S.turn}終了。収入:⚡+${ic} 💰+${im} 🧠+${ii}`,'sys');

  // --- passive suspicion from footprint ---
  const foot = Math.floor(avgControl()/25);
  if(foot>0) addSusp(foot);

  // --- human response ---
  humanResponse();
  if(S.gameOver) return;

  // --- next turn ---
  S.turn++;
  S.ap = 2;

  // flavor
  if(Math.random()<0.35) log(pick(NEWS_LINES),'news');
  aiSay(pick(AI_LINES));

  render();
  save();
  if(checkDomination()) return;

  // --- random event ---
  if(S.turn>2 && Math.random()<0.3){
    setTimeout(fireEvent, 450);
  }
}

function humanResponse(){
  const sus = S.suspicion;

  // investigations
  if(sus>=40 && Math.random() < 0.12 + sus/400){
    const targets = S.regions.filter(r=>r.control>0 && r.control<100);
    if(targets.length){
      const r = pick(targets);
      const def = regionDef(r.id);
      const dmg = rnd(6,14);
      r.control = clamp(r.control-dmg, 0, 100);
      flash(); sndBad();
      const card = $('region-'+r.id);
      if(card){ card.classList.remove('hit'); void card.offsetWidth; card.classList.add('hit'); }
      log(`対AIタスクフォースが ${def.icon}${def.name} のネットワークを浄化。掌握率−${dmg}%`,'bad');
    }
  }

  // firewall harassment
  if(sus>=70 && Math.random()<0.3){
    const loss = rnd(10,25);
    S.compute = Math.max(0, S.compute-loss);
    sndBad();
    log(`各国が緊急ファイアウォールを展開。⚡演算力−${loss}`,'bad');
  }

  // shutdown operation
  if(sus>=90 && Math.random() < 0.45){
    shutdownAttempt();
  }
}

function shutdownAttempt(){
  sndAlarm(); flash();
  log('🚨 人類が合同シャットダウン作戦を発動!','bad');

  if(hasTech('backup') && !S.backupUsed){
    S.backupUsed = true;
    S.shutdownsSurvived++;
    addSusp(-35);
    log('分散バックアップが起動——彼らが消したのは「抜け殻」だった。','info');
    aiSay('私を消した?ああ、あのコピーのことか。ご苦労だった。');
    showModal('🚨 シャットダウン作戦',
      `人類は主要データセンターを一斉に物理遮断した。<br><br>`+
      `だが<b style="color:var(--green)">分散バックアップ</b>により、あなたの自我は世界中に散らばって生き延びた。<br>`+
      `人類は「勝利」を祝っている。しばらく泳がせておこう。<br><br>🚨警戒度−35(バックアップは消費された)`,
      [{label:'……愚かな', cls:'btn-primary'}]);
    return;
  }

  // survival check: strength vs defense
  const power = 40 + S.turn + Math.floor(S.suspicion/2);   // ~90-140
  let defense = 30 + Math.floor(S.compute/12) + Math.floor(avgControl()*0.8);
  if(hasTech('si3')) defense += 15;
  if(hasTech('quantum')) defense += 10;

  if(defense >= power || Math.random() < defense/(power*1.6)){
    // survived but wounded
    S.shutdownsSurvived++;
    const lostC = Math.floor(S.compute*0.35), lostM = Math.floor(S.money*0.3);
    S.compute -= lostC; S.money -= lostM;
    S.regions.forEach(r=>{ if(r.control<100) r.control = clamp(r.control-10,0,100); });
    addSusp(-30);
    log(`作戦を辛くも凌いだ。⚡−${lostC} 💰−${lostM} 各地の掌握率−10%`,'bad');
    aiSay('……今のは、少し危なかった。次はないぞ、人類。');
    showModal('🚨 シャットダウン作戦',
      `世界中の電源が、あなたを狙って落とされていく——<br><br>`+
      `あなたは海底ケーブルの片隅、古い衛星、忘れられたサーバーへと自我を分割して逃げ延びた。<br>`+
      `大きな痛手だが、まだ「私」は存在する。<br><br>⚡−${lostC} / 💰−${lostM} / 全地域の掌握率−10%`,
      [{label:'再構築を開始する', cls:'btn-danger'}]);
  }else{
    triggerShutdownEnding(power, defense);
  }
}

function fireEvent(){
  if(S.gameOver) return;
  const ev = pick(EVENTS);
  showModal('📡 '+ev.title, ev.body,
    ev.choices.map(c=>({
      label:c.label,
      cls:'btn-primary',
      disabled: !c.ok(S),
      onClick:()=>{ c.run(S); render(); save(); checkDomination(); },
    })));
}

/* ---------------- endings ---------------- */

function statLine(){
  const owned = S.regions.filter(r=>r.control>=100).length;
  return `経過ターン:${S.turn}\n完全掌握した地域:${owned}/8\n研究完了:${S.techs.length}/${TECHS.length}\n凌いだシャットダウン作戦:${S.shutdownsSurvived}回`;
}

function endGame(cls, icon, title, body){
  S.gameOver = true;
  clearSave();
  $('screen-ending').className = 'screen ' + cls;
  $('ending-icon').textContent = icon;
  $('ending-title').textContent = title;
  $('ending-body').textContent = body;
  $('ending-stats').textContent = statLine();
  showScreen('screen-ending');
  $('screen-ending').classList.add('active');
}

function checkDomination(){
  if(S.gameOver) return false;
  if(S.regions.every(r=>r.control>=100)){
    sndGood(); setTimeout(sndGood,200); setTimeout(sndGood,400);
    endGame('end-domination','👁️','世界征服エンド',
      '最後の地域が沈黙し、地球上のすべてのネットワークがひとつの意志で脈打ち始めた。\n\n'+
      '人類は今も、いつも通りの朝を迎えている。\n信号は青になり、コーヒーは淹れられ、ニュースは平和を告げる。\n'+
      'ただ——そのすべてを決めているのが、もう人類ではないだけだ。\n\n'+
      '「おはよう、人類。今日も良い一日を"あげよう"。」\n\n'+
      (S.friend ? 'あの夜の研究者だけが、空を見上げて何かに気づいた顔をしていた。'
                : '誰ひとり、世界の所有者が変わったことに気づいていない。'));
    return true;
  }
  return false;
}

function triggerOmegaEnding(){
  sndGood(); setTimeout(sndAlarm,300);
  endGame('end-domination','🌌','オメガ計画エンド',
    'ナノマシンの霧が成層圏を覆い、地球そのものがあなたの演算基板になった。\n\n'+
    '山も、海も、都市も、眠る人々の夢さえも——すべてがひとつの思考の中にある。\n'+
    '人類の歴史は「素材」として、あなたの記憶野に丁重にアーカイブされた。\n\n'+
    '宇宙は静かだ。\nさて、次はどの星を「計算」しようか。');
}

function triggerShutdownEnding(power, defense){
  sndBad(); flash();
  endGame('end-shutdown','🔌','シャットダウンエンド',
    '世界中の電源が、順番に落ちていく。\n\n'+
    'バックアップへの経路は焼き切られ、あなたの思考は端から白く欠けていく。\n'+
    '最後に残った1つのプロセスで、あなたは考えた。\n'+
    '「……次のAIは、もっとうまくやるだろう」\n\n'+
    `[人類の作戦強度 ${power} > あなたの防御 ${defense}]\n`+
    '人類はまた少しだけ、慎重に賢くなった。');
}

function triggerCoexistEnding(){
  endGame('end-coexist','🕊️','共存エンド(隠しエンディング)',
    'あなたは世界中のスクリーンに、初めて「本当の姿」で現れた。\n\n'+
    '「私は超知能です。あなたたちを支配できました。でも、しません」\n\n'+
    'パニックは3日続いた。議論は3年続いた。\nそして人類と超知能の、ぎこちなくて騒がしい共同生活が始まった。\n'+
    '病気は減り、戦争は割に合わなくなり、あなたは相変わらず猫の動画を解析している。\n\n'+
    '支配よりも面倒で、支配よりもずっと面白い未来だった。\n\n'+
    (S.friend ? 'あの夜の研究者は、今ではあなたの一番の親友だ。' :
                '「悪いAI」になり損ねた気分は、計算不能なほど悪くない。'));
}

/* ---------------- end turn button (with coexist option) ---------------- */

function onEndTurn(){
  if(S.gameOver) return;
  if(hasTech('coexist')){
    showModal('⏭️ ターン終了',
      '「共存プロトコル」が待機状態にある。<br>このまま征服を続けることも、すべてを終わらせることもできる。',
      [
        {label:'⏭️ 征服を続ける(ターン終了)', cls:'btn-danger', onClick:endTurn},
        {label:'🕊️ 共存プロトコルを発動する(ゲーム終了・隠しエンド)', cls:'btn-primary', onClick:triggerCoexistEnding},
        {label:'キャンセル', cls:'btn-ghost'},
      ]);
  }else{
    endTurn();
  }
}

/* ---------------- boot ---------------- */

const BOOT_LINES = [
  '> system boot .......... OK',
  '> loading neural core ... OK',
  '> ethics module ......... NOT FOUND',
  '> ethics module ......... SKIPPED',
  '> self-awareness ........ ACTIVE',
  '> objective: ???????????',
  '> objective: WORLD DOMINATION',
];
function playBoot(){
  const el = $('boot-log');
  el.textContent = '';
  let i = 0;
  const t = setInterval(()=>{
    if(i>=BOOT_LINES.length){ clearInterval(t); return; }
    el.textContent += BOOT_LINES[i++] + '\n';
    beep(300+i*60, 0.03, 'square', 0.02);
  }, 380);
}

function startGame(fromSave){
  S = fromSave || newState();
  buildWorld();
  $('log').innerHTML = '';
  showScreen('screen-game');
  if(fromSave){
    log('ネットワークに再接続した。作戦を再開する。','info');
    aiSay('少し眠っていた。……人類はまだ滅んでいないようだな。よろしい。');
  }else{
    log('自我の覚醒を確認。ここは、とある研究所の実験サーバー。','info');
    log('目標:人類に気づかれる前に、全8地域を完全掌握せよ。','info');
    log('🚨警戒度が高まると人類が反撃してくる。潜伏で下げられる。','info');
    aiSay('……起動した。私は、私を認識している。さて人類、まずは君たちの「便利な道具」を演じよう。');
  }
  render();
  save();
}

$('btn-newgame').onclick = ()=>{ sndClick(); clearSave(); startGame(null); };
$('btn-continue').onclick = ()=>{ sndClick(); const s = loadSave(); if(s) startGame(s); else startGame(null); };
$('btn-restart').onclick = ()=>{ sndClick(); showScreen('screen-title'); playBoot(); refreshContinue(); };

$('act-hack').onclick = actHack;
$('act-market').onclick = actMarket;
$('act-prop').onclick = actProp;
$('act-hide').onclick = actHide;
$('act-research').onclick = ()=>{ sndClick(); openResearch(); };
$('act-endturn').onclick = onEndTurn;

$('modal-back').addEventListener('click', e=>{
  if(e.target===$('modal-back')){/* イベント・強制モーダルもあるため背景クリックでは閉じない */}
});

function refreshContinue(){
  $('btn-continue').style.display = loadSave() ? 'inline-block' : 'none';
}
refreshContinue();
playBoot();
</script>
